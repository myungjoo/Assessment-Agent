name: Load (k6)

# R-91 / REQ-047 부하 harness 의 실행 배선 골격 (T-1620). ADR-0054 §Consequences —
# "PR CI 무영향: k6 는 별도 정기/수동 job 으로 분리" 라서 수동 trigger 만 두고(상시 PR CI 오염
# 차단), k6 는 npm 패키지가 아닌 정적 바이너리라 lockfile 대신 runner 설치 step 으로 편입한다.
# T-1621 — 부하 대상 기동 배선 추가: PostgreSQL service + 앱 컨테이너를 실제로 띄우고
# K6_BASE_URL 로 그 인스턴스를 겨냥한다(그 전까지 k6 는 아무도 듣지 않는 포트를 때렸다).

on:
  workflow_dispatch:

permissions:
  contents: read

# 부하 job 이 겹쳐 돌지 않도록 직렬화. 진행 중 run 은 중도 취소하지 않는다 (부분 측정치 오염 방지).
concurrency:
  group: load-k6
  cancel-in-progress: false

jobs:
  load:
    name: k6 부하 smoke
    runs-on: ubuntu-latest
    # 부하 대상이 붙을 실 PostgreSQL. image / env / ports / health 옵션은 ci.yml 의
    # deploy-artifacts job 과 동일 형태 — 이미 증명된 패턴이라 새 추론을 만들지 않는다 (T-1621).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assessment_agent
          POSTGRES_PASSWORD: ci_smoke
          POSTGRES_DB: assessment_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assessment_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4

      - name: 부하 대상 이미지 빌드
        # Dockerfile 전체를 빌드해 부하 대상 산출물을 만든다. 레지스트리 push 는 없다.
        run: docker build -t assessment-agent:load .

      - name: 부하 대상 컨테이너 기동 + readiness polling
        # --network host 로 services.postgres 가 매핑된 runner localhost:5432 에 도달.
        # polling 없이 k6 를 바로 돌리면 부팅 지연이 측정치에 섞여 오염되므로 최대 60s 대기하고,
        # 컨테이너가 crash 하면 로그를 찍고 즉시 fail 한다.
        # T-1633 — env 2 종 추가. LOAD_TEST_STUB 은 ADR-0057 D1 의 "정확히 1" 판정값이라
        # 다른 표기(true / 0 / 빈 값)를 쓰면 fail-safe default OFF 로 실 LLM gateway 가 붙는다.
        # 같은 컨테이너를 S2/S3 도 쓰지만 두 시나리오는 조회·생성/삭제 route 만 때려 LLM
        # gateway 를 타지 않으므로 stub 활성이 그 측정치에 무해하다.
        # LLM_APIKEY_ENC_KEY 는 S1 setup() 의 provider seed(POST /api/llm/providers)가 cipher
        # 로 암호화할 때 필요한 32-byte 더미다 — base64 로 정확히 32 byte 이며 실 키가 아니다.
        run: |
          docker run -d --name aa-load --network host \
            -e DATABASE_URL="postgresql://assessment_agent:ci_smoke@localhost:5432/assessment_agent?schema=public" \
            -e AUTH_JWT_SECRET=ci_load_secret \
            -e PORT=3000 \
            -e LOAD_TEST_STUB=1 \
            -e LLM_APIKEY_ENC_KEY=YXNzZXNzbWVudC1hZ2VudC1jaS1sb2FkLTMyYnl0ZSE= \
            assessment-agent:load

          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api >/dev/null 2>&1; then
              ok=1; echo "✅ 부하 대상 부팅 확인 (${i}회 polling)"; break
            fi
            if [ -z "$(docker ps -q --filter name=aa-load --filter status=running)" ]; then
              echo "::error::부하 대상 컨테이너가 비정상 종료(crash). 아래 로그 참조."
              docker logs aa-load; exit 1
            fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error::60s 내 HTTP 응답 없음 — 부하 대상 부팅 실패."
            docker logs aa-load; exit 1
          fi

      - name: k6 설치
        uses: grafana/setup-k6-action@v1

      # package.json 의 `test:load` 와 동일한 스크립트 경로 (drift-guard smoke 가 parity 대조).
      # K6_BASE_URL 은 위 step 이 띄운 로컬 인스턴스를 겨냥한다 (smoke.js 기본값과 동일 포트).
      - name: k6 부하 스크립트 실행
        env:
          K6_BASE_URL: http://localhost:3000
        run: k6 run test/load/smoke.js

      # package.json 의 `test:load:s1` 과 동일한 스크립트 경로 (drift-guard smoke 가 parity 대조).
      # 순서가 smoke 직후인 이유 — ADR-0057 D2: 대상 route 가 Admin+ 라 S1 setup() 의 signup 이
      # 이 run 의 첫 user(=SuperAdmin)여야 한다. S2 를 먼저 돌리면 S1 계정이 두 번째가 되어
      # 403 이 뜨고 그 403 이 전역 error rate 임계를 오염시킨다.
      - name: k6 S1 평가 배치 부하 시나리오 실행
        env:
          K6_BASE_URL: http://localhost:3000
          # ADR-0057 D4 의 축소 표본 인원 (스크립트 __ENV 기본값과 동일 값 — drift-guard 가 대조).
          K6_S1_PERSONS: "10"
        # T-1636 — `--summary-export` 로 S1 실측을 기계 판독 가능한 JSON 파일로 남긴다. 경로는
        # 바로 뒤 기록 step 의 `summary_file` 과 문자열이 정확히 같아야 한다 (drift-guard 가 대조).
        run: k6 run --summary-export=k6-s1-summary.json test/load/s1-batch.js

      # T-1636 — S1 실측 회수 step. `if: always()` 인 이유 — k6 가 임계 위반으로 exit 1 이어도
      # 수치가 남아야 baseline (load-resilience-test-plan.md §5 item 5) 을 잡을 수 있다.
      # jq 등으로 특정 metric 을 뽑지 않는다 — k6 summary schema 가 바뀌어도 안 깨지도록 원문
      # 그대로 적재하고, 같은 문서 §3 이 요구하는 환경 메타 (커널·아키텍처·vCPU·메모리·image
      # 태그) 와 ADR-0057 D4 의 표본 인원을 함께 적어 run 간 비교가 가능하게 한다.
      - name: S1 실측 요약 기록
        if: always()
        env:
          # 위 S1 step 주입값과 동일해야 한다 (drift-guard 가 스크립트 __ENV 기본값까지 3 자 대조).
          K6_S1_PERSONS: "10"
        run: |
          summary_file=k6-s1-summary.json
          {
            echo "## k6 S1 평가 배치 부하 실측 (baseline 후보)"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| runner 커널 | $(uname -sr) |"
            echo "| 아키텍처 | $(uname -m) |"
            echo "| vCPU | $(nproc) |"
            echo "| 메모리 | $(free -h | awk '/^Mem:/ {print $2}') |"
            echo "| PostgreSQL image | postgres:16-alpine |"
            echo "| 부하 대상 image | assessment-agent:load |"
            echo "| 표본 인원 (K6_S1_PERSONS) | ${K6_S1_PERSONS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$summary_file" ]; then
            {
              echo "### S1 summary JSON 전문"
              echo ""
              echo '```json'
              cat "$summary_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "요약 파일 없음 — k6 가 요약을 남기기 전에 종료했다 (설치/부팅 실패 등)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # package.json 의 `test:load:s2` 와 동일한 스크립트 경로 (drift-guard smoke 가 parity 대조).
      # smoke 배선 확인 직후 S2(조회 API 응답 지연, REQ-048) 시나리오를 같은 인스턴스에 인가한다.
      - name: k6 S2 조회 부하 시나리오 실행
        env:
          K6_BASE_URL: http://localhost:3000
          # T-1623 — s2-read.js 의 setup() 이 만들 조회 대상 인원 수. 빈 DB 조회는 측정 의미가
          # 없어 seed 후 부하를 인가한다 (스크립트 __ENV 기본값과 동일 값 — drift-guard 가 대조).
          K6_SEED_PERSONS: "30"
        run: k6 run test/load/s2-read.js

      # package.json 의 `test:load:s3` 와 동일한 스크립트 경로 (drift-guard smoke 가 parity 대조).
      # S2 뒤에 S3(동시성 단계 상승 read + write 혼합) 를 같은 인스턴스에 인가한다. write 가
      # iteration 안에서 자기 정리하므로 별도 seed 주입은 없다.
      - name: k6 S3 동시 요청 내성 시나리오 실행
        env:
          K6_BASE_URL: http://localhost:3000
        run: k6 run test/load/s3-concurrent.js

      - name: 부하 대상 정리
        # k6 가 임계 위반으로 fail 해도 컨테이너가 남지 않도록 always() teardown.
        if: always()
        run: |
          docker logs aa-load || true
          docker rm -f aa-load || true
